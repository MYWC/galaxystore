  <!-- ✅ Fix: تشخیص خودکار Base Path (کار می‌کند از هر URL) -->
  <script>
    (function() {
      var path = window.location.pathname;
      var segments = path.split('/').filter(Boolean);
      // اولین بخشی که به عنوان repo-name (galaxystore) شناخته می‌شود
      var repoIdx = -1;
      for (var i = 0; i < segments.length; i++) {
        if (segments[i] === 'galaxystore') {
          repoIdx = i;
          break;
        }
      }
      var base = repoIdx >= 0
        ? '/' + segments.slice(0, repoIdx + 1).join('/') + '/'
        : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>

  <style>
    .err-page {
      padding-block: 60px 100px;
      min-height: 60vh;
      display: flex;
      align-items: center;
    }
    .err-wrap {
      max-width: 620px;
      margin-inline: auto;
      text-align: center;
    }
    .err-code {
      font-size: clamp(120px, 22vw, 200px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -6px;
      background: linear-gradient(120deg, #2386D7, #16B5A5, #7C5CFF, #2386D7);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientMove 5s ease infinite;
      margin-bottom: 8px;
    }
    .err-icon {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #FDECEC, #FCDADA);
      color: #EF5350;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .err-icon svg { width: 40px; height: 40px; stroke-width: 1.8; }
    .err-title {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.6px;
      margin-bottom: 12px;
    }
    .err-desc {
      font-size: var(--fs-md);
      color: var(--text-muted);
      line-height: 1.85;
      margin-bottom: 32px;
    }
    .err-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .err-actions .btn {
      height: 52px;
      padding-inline: 26px;
      font-size: var(--fs-md);
    }
    .err-links {
      padding-top: 28px;
      border-top: 1px solid var(--border-soft);
    }
    .err-links__title {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .err-links__grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .err-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .err-link:hover {
      background: #EAF4FD;
      color: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .err-link svg { width: 14px; height: 14px; stroke-width: 2; }
  </style>
