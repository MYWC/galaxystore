<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2386D7" />
  <title>صفحه پیدا نشد | موبایل استور</title>
  <meta name="robots" content="noindex" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <link rel="stylesheet" href="css/components/button.css" />
  <link rel="stylesheet" href="css/components/card.css" />
  <link rel="stylesheet" href="css/components/badge.css" />
  <link rel="stylesheet" href="css/components/placeholder.css" />
  <link rel="stylesheet" href="css/components/floating.css" />
  <link rel="stylesheet" href="css/components/drawer.css" />
  <link rel="stylesheet" href="css/components/toast.css" />
  <link rel="stylesheet" href="css/components/cart-drawer.css" />
  <link rel="stylesheet" href="css/components/quick-view.css" />
  <link rel="stylesheet" href="css/components/search-dropdown.css" />

  <link rel="stylesheet" href="css/sections/announcement.css" />
  <link rel="stylesheet" href="css/sections/header.css" />
  <link rel="stylesheet" href="css/sections/nav.css" />
  <link rel="stylesheet" href="css/sections/footer.css" />

  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/performance.css" />
  <link rel="stylesheet" href="css/micro-interactions.css" />

  <style>
    .err-page {
      padding-block: 60px 100px;
      min-height: 60vh;
      display: flex;
      align-items: center;
    }

    .err-wrap {
      max-width: 620px;
      margin-inline: auto;
      text-align: center;
      position: relative;
    }

    .err-code {
      font-size: clamp(120px, 22vw, 200px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -6px;
      background: linear-gradient(120deg, #2386D7, #16B5A5, #7C5CFF, #2386D7);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientMove 5s ease infinite;
      margin-bottom: 8px;
    }

    .err-icon {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #FDECEC, #FCDADA);
      color: #EF5350;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .err-icon svg {
      width: 40px;
      height: 40px;
      stroke-width: 1.8;
    }

    .err-title {
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.6px;
      margin-bottom: 12px;
    }

    .err-desc {
      font-size: var(--fs-md);
      color: var(--text-muted);
      line-height: 1.85;
      margin-bottom: 32px;
    }

    .err-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .err-actions .btn {
      height: 52px;
      padding-inline: 26px;
      font-size: var(--fs-md);
    }

    .err-links {
      padding-top: 28px;
      border-top: 1px solid var(--border-soft);
    }

    .err-links__title {
      font-size: var(--fs-xs);
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .err-links__grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .err-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: var(--fs-xs);
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .err-link:hover {
      background: #EAF4FD;
      color: var(--primary);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .err-link svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }
  </style>
</head>
<body>

  <div id="layout-announcement"></div>
  <div id="layout-header"></div>
  <div id="layout-nav"></div>

  <main class="err-page">
    <div class="container">
      <div class="err-wrap">

        <div class="err-code">۴۰۴</div>

        <div class="err-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="8" y1="8" x2="14" y2="14"/>
            <line x1="14" y1="8" x2="8" y2="14"/>
          </svg>
        </div>

        <h1 class="err-title">صفحه‌ای که دنبالش بودید پیدا نشد</h1>

        <p class="err-desc">
          ممکنه آدرس اشتباه تایپ شده باشه، یا این صفحه حذف شده باشه.
          از لینک‌های زیر می‌تونید به مسیر درست برگردید.
        </p>

        <div class="err-actions">
          <a href="index.html" class="btn btn--primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            بازگشت به خانه
          </a>
          <a href="category.html" class="btn btn--outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            مشاهده محصولات
          </a>
        </div>

        <div class="err-links">
          <div class="err-links__title">لینک‌های پرطرفدار</div>
          <div class="err-links__grid">
            <a href="category.html?filter=discount" class="err-link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
              تخفیف‌های امروز
            </a>
            <a href="brand.html?id=apple" class="err-link">آیفون</a>
            <a href="brand.html?id=samsung" class="err-link">سامسونگ</a>
            <a href="support/track.html" class="err-link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
              پیگیری سفارش
            </a>
            <a href="support/contact.html" class="err-link">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              تماس با ما
            </a>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="layout-footer"></div>
  <div id="layout-drawer"></div>
  <div id="layout-cart-drawer"></div>
  <div id="layout-quick-view"></div>
  <div id="layout-floating"></div>

  <script type="module">
    import { initLayout } from './js/components/layout.js';
    initLayout();
  </script>
</body>
</html>
