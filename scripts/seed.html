<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>درون‌ریزی محصولات</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Vazirmatn, system-ui, sans-serif;
      direction: rtl;
      background: linear-gradient(135deg, #EEF8FF 0%, #F3F0FF 100%);
      margin: 0; padding: 40px 20px; min-height: 100vh;
    }
    .box {
      max-width: 760px; margin: 0 auto; background: #fff;
      border-radius: 24px; padding: 36px;
      box-shadow: 0 30px 60px -30px rgba(23,32,42,0.2);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p.sub { color: #6B7280; margin: 0 0 28px; line-height: 1.7; }
    code {
      background: #F6F9FB; padding: 2px 8px; border-radius: 6px;
      font-family: monospace; font-size: 13px; color: #2386D7;
    }
    .stat {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 16px; margin-bottom: 24px;
    }
    .stat > div {
      padding: 20px; background: linear-gradient(135deg, #EAF4FD, #DCEBFB);
      border-radius: 16px; text-align: center;
    }
    .stat strong {
      display: block; font-size: 32px; color: #2386D7;
      font-weight: 900; line-height: 1; margin-bottom: 6px;
    }
    .stat span { font-size: 12px; color: #6B7280; font-weight: 600; }
    .progress {
      height: 10px; background: #E6EBEF; border-radius: 999px;
      overflow: hidden; margin-bottom: 20px;
    }
    .progress__fill {
      height: 100%; background: linear-gradient(90deg, #2386D7, #16B5A5);
      transition: width 0.3s; width: 0; border-radius: 999px;
    }
    button {
      width: 100%; padding: 18px 28px; background: #2386D7; color: #fff;
      border: none; border-radius: 14px; font-size: 17px; font-weight: 800;
      cursor: pointer; font-family: inherit; transition: all 0.2s;
      box-shadow: 0 12px 28px -10px rgba(35,134,215,0.5);
    }
    button:hover:not(:disabled) { background: #1B6FB5; transform: translateY(-2px); }
    button:disabled { background: #CBD5E0; cursor: not-allowed; box-shadow: none; }
    .log {
      margin-top: 20px; padding: 18px; background: #0B1219; color: #A8E4DC;
      border-radius: 14px; font-family: monospace; font-size: 12.5px;
      max-height: 380px; overflow-y: auto; direction: ltr; text-align: left;
      line-height: 1.75;
    }
    .log:empty::before { content: 'آماده...'; opacity: 0.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚀 درون‌ریزی محصولات</h1>
    <p class="sub">
      همه محصولات از <code>js/data/products/*.js</code> خوانده و به جدول
      <code>products</code> در Supabase فرستاده می‌شوند.
    </p>

    <div class="stat">
      <div>
        <strong id="count-products">—</strong>
        <span>محصول آماده</span>
      </div>
      <div>
        <strong id="count-brands">—</strong>
        <span>برند</span>
      </div>
    </div>

    <div class="progress">
      <div class="progress__fill" id="progress"></div>
    </div>

    <button id="seed-btn" disabled>شروع درون‌ریزی</button>
    <div class="log" id="log"></div>
  </div>

  <script type="module">
    import { supabase, isSupabaseConfigured } from '../js/services/supabase.js';
    import { appleProducts } from '../js/data/products/apple.js';
    import { samsungProducts } from '../js/data/products/samsung.js';
    import { xiaomiProducts } from '../js/data/products/xiaomi.js';
    import { googleProducts } from '../js/data/products/google.js';
    import { oneplusProducts } from '../js/data/products/oneplus.js';
    import { honorProducts } from '../js/data/products/honor.js';
    import { huaweiProducts } from '../js/data/products/huawei.js';
    import { oppoProducts } from '../js/data/products/oppo.js';
    import { vivoProducts } from '../js/data/products/vivo.js';
    import { transsionProducts } from '../js/data/products/transsion.js';

    const allProducts = [
      ...appleProducts, ...samsungProducts, ...xiaomiProducts,
      ...googleProducts, ...oneplusProducts, ...honorProducts,
      ...huaweiProducts, ...oppoProducts, ...vivoProducts,
      ...transsionProducts,
    ];

    const unique = Object.values(
      allProducts.reduce((acc, p) => { acc[p.id] = p; return acc; }, {})
    );

    const brands = new Set(unique.map((p) => p.brand));

    document.getElementById('count-products').textContent = unique.length.toLocaleString('fa-IR');
    document.getElementById('count-brands').textContent = brands.size.toLocaleString('fa-IR');

    const btn = document.getElementById('seed-btn');
    const logEl = document.getElementById('log');
    const progressEl = document.getElementById('progress');

    function log(msg, type = 'info') {
      const colors = { info: '#A8E4DC', success: '#18B981', error: '#EF5350' };
      const time = new Date().toLocaleTimeString('en-GB');
      logEl.innerHTML += `<div style="color:${colors[type]}">[${time}] ${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    if (!isSupabaseConfigured()) {
      log('✗ Supabase تنظیم نشده', 'error');
      btn.textContent = 'Supabase تنظیم نشده';
    } else {
      btn.disabled = false;
      log(`✓ Supabase آماده است`, 'success');
      log(`✓ ${unique.length} محصول (${brands.size} برند) آماده`, 'success');
    }

    btn.addEventListener('click', async () => {
      if (!isSupabaseConfigured()) return;
      btn.disabled = true;
      btn.textContent = 'در حال درون‌ریزی...';

      const payload = unique.map((p) => ({
        id: p.id,
        brand: p.brand,
        name: p.name,
        model: p.model || null,
        category: p.category || null,
        type: p.type || null,
        year: p.year || null,
        rating: p.rating || 0,
        reviews: p.reviews || 0,
        badges: p.badges || [],
        colors: p.colors || [],
        variants: p.variants || [],
        image: p.image || null,
        is_active: true,
      }));

      const BATCH = 25;
      const totalBatches = Math.ceil(payload.length / BATCH);
      let successCount = 0, errorCount = 0;

      for (let i = 0; i < totalBatches; i++) {
        const batch = payload.slice(i * BATCH, (i + 1) * BATCH);
        log(`Batch ${i + 1}/${totalBatches} — ${batch.length} محصول...`, 'info');
        try {
          const { error } = await supabase
            .from('products')
            .upsert(batch, { onConflict: 'id' });
          if (error) {
            errorCount += batch.length;
            log(`  ✗ ${error.message}`, 'error');
          } else {
            successCount += batch.length;
            log(`  ✓ ${batch.length} موفق`, 'success');
          }
        } catch (err) {
          errorCount += batch.length;
          log(`  ✗ ${err.message}`, 'error');
        }
        progressEl.style.width = `${Math.round(((i + 1) / totalBatches) * 100)}%`;
      }

      log(`✓ موفق: ${successCount}`, 'success');
      if (errorCount) log(`✗ خطا: ${errorCount}`, 'error');

      try {
        const { count } = await supabase
          .from('products')
          .select('*', { count: 'exact', head: true });
        log(`📊 مجموع در دیتابیس: ${count}`, 'success');
      } catch {}

      btn.textContent = 'تکمیل شد ✅';
      btn.style.background = '#18B981';
    });
  </script>
</body>
</html>
