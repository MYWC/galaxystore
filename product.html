<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2386D7" />
  <title>صفحه محصول | موبایل استور</title>
  <meta name="description" content="مشخصات کامل، قیمت و خرید با ضمانت اصالت" />

  <!-- Common CSS -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />

  <link rel="stylesheet" href="css/components/button.css" />
  <link rel="stylesheet" href="css/components/card.css" />
  <link rel="stylesheet" href="css/components/badge.css" />
  <link rel="stylesheet" href="css/components/placeholder.css" />
  <link rel="stylesheet" href="css/components/product-card.css" />
  <link rel="stylesheet" href="css/components/floating.css" />
  <link rel="stylesheet" href="css/components/drawer.css" />
  <link rel="stylesheet" href="css/components/toast.css" />
  <link rel="stylesheet" href="css/components/cart-drawer.css" />
  <link rel="stylesheet" href="css/components/quick-view.css" />
  <link rel="stylesheet" href="css/components/search-dropdown.css" />

  <link rel="stylesheet" href="css/sections/announcement.css" />
  <link rel="stylesheet" href="css/sections/header.css" />
  <link rel="stylesheet" href="css/sections/nav.css" />
  <link rel="stylesheet" href="css/sections/footer.css" />
  <link rel="stylesheet" href="css/sections/reviews.css" />

  <!-- Product Detail CSS -->
  <link rel="stylesheet" href="css/sections/product-detail.css" />

  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/performance.css" />
  <link rel="stylesheet" href="css/micro-interactions.css" />
</head>
<body>

  <!-- ============================================
       LAYOUT (Auto-injected)
       ============================================ -->
  <div id="layout-announcement"></div>
  <div id="layout-header"></div>
  <div id="layout-nav"></div>

  <!-- ============================================
       MAIN CONTENT
       ============================================ -->
  <main class="product-page" id="product-page">
    <div class="container">

      <!-- Breadcrumb -->
      <nav class="breadcrumb reveal" id="breadcrumb" aria-label="مسیر">
        <a href="index.html">خانه</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        <a href="category.html?type=phone">گوشی موبایل</a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="breadcrumb-current">محصول</span>
      </nav>

      <!-- Product Main -->
      <div class="product-layout">

        <!-- ===== Gallery ===== -->
        <div class="product-gallery reveal reveal--right" id="product-gallery">
          <div class="product-gallery__main">
            <div class="product-gallery__img" id="gallery-main">
              <div class="ph ph--square">تصویر محصول</div>
            </div>
            <span class="product-gallery__badge" id="gallery-badge"></span>
          </div>
          <div class="product-gallery__thumbs" id="gallery-thumbs"></div>
        </div>

        <!-- ===== Info ===== -->
        <div class="product-info reveal reveal--left" id="product-info">
          <!-- Skeleton shown until JS renders -->
          <div class="skeleton skeleton-card__line skeleton-card__line--short" style="height:14px; width:120px;"></div>
          <div class="skeleton skeleton-card__line skeleton-card__line--full" style="height:28px; margin-top:16px;"></div>
          <div class="skeleton skeleton-card__line skeleton-card__line--medium" style="height:20px; margin-top:12px;"></div>
        </div>

      </div>

      <!-- ===== Tabs ===== -->
      <div class="product-tabs reveal" id="product-tabs">
        <div class="product-tabs__nav">
          <button class="product-tabs__tab is-active" data-tab="specs">مشخصات فنی</button>
          <button class="product-tabs__tab" data-tab="desc">توضیحات</button>
          <button class="product-tabs__tab" data-tab="reviews">نظرات کاربران</button>
        </div>
        <div class="product-tabs__content" id="product-tabs-content"></div>
      </div>

      <!-- ===== Similar Products ===== -->
      <section class="product-similar reveal" id="product-similar">
        <div class="product-similar__head">
          <h2 class="product-similar__title">محصولات مشابه</h2>
          <a href="category.html" class="product-similar__link">
            مشاهده همه
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </a>
        </div>
        <div class="product-similar__grid" id="similar-grid"></div>
      </section>

    </div>
  </main>

  <!-- ============================================
       LAYOUT (Auto-injected)
       ============================================ -->
  <div id="layout-footer"></div>
  <div id="layout-drawer"></div>
  <div id="layout-cart-drawer"></div>
  <div id="layout-quick-view"></div>
  <div id="layout-floating"></div>

  <script type="module" src="js/pages/product.js"></script>
</body>
</html>
